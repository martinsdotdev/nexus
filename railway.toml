# Railway service config for the Nexus relay. Builds the Dockerfile and runs the one
# binary that serves the UI + /sync. The image's CMD is the launch path: a shell-form
# command that expands the Railway-injected $PORT and the volume mount path and forces
# --host 0.0.0.0 (the binary's own default stays 127.0.0.1 for local-first use), so no
# startCommand is set here. The healthcheck hits GET / which returns index.html (200)
# because the CMD passes --static-dir; keep those two in sync.
#
# Constraints: run a single replica only (the canonical Loro doc is in process memory
# and persists to one volume; replicas would diverge). Attach a volume so
# RAILWAY_VOLUME_MOUNT_PATH points at durable storage; without it the workspace is
# ephemeral and resets on every redeploy.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
